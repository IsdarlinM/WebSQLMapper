name: Installer smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline/source-path fallback smoke
        run: bash scripts/test-install-linux.sh
      - name: Normal online dependency/install smoke
        run: bash scripts/test-install-linux-online.sh
  windows-installer:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run CMD installer with existing compatible Python
        shell: cmd
        run: |
          set WEBSQLMAPPER_INSTALL_ROOT=%RUNNER_TEMP%\WebSQLMapper
          set WEBSQLMAPPER_SKIP_PATH=1
          call scripts\install.cmd
          call %RUNNER_TEMP%\WebSQLMapper\bin\websqlmapper.cmd --version
          call %RUNNER_TEMP%\WebSQLMapper\bin\websqlmapper.cmd --color never doctor
