name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e .
      - run: python -m compileall -q websqlmapper lab tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/cli_smoke.py
      - run: node --check websqlmapper/static/app.js
      - run: websqlmapper --version
      - run: websqlmapper --color never doctor
