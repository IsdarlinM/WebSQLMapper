[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websqlmapper"
version = "0.4.1"
description = "Adaptive authorized SQL injection detection with robust redirects, sessions, job streaming, and private-lab SQLite mapping."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "imr"}]
keywords = ["security", "sql-injection", "sqli", "testing", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
socks = ["PySocks>=1.7.1,<2"]

[project.scripts]
websqlmapper = "websqlmapper.cli:main"

[tool.setuptools]
packages = ["websqlmapper"]

[tool.setuptools.package-data]
websqlmapper = ["static/*.html", "static/*.css", "static/*.js", "static/*.webmanifest"]
