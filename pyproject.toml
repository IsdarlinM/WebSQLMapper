[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websqlmapper"
version = "0.1.0"
description = "Authorized SQL injection detection and lab-only blind SQLite mapping toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "imr"}]
keywords = ["security", "sql-injection", "sqli", "testing", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
websqlmapper = "websqlmapper.cli:main"

[tool.setuptools]
packages = ["websqlmapper"]

[tool.setuptools.package-data]
websqlmapper = ["static/*.html", "static/*.css", "static/*.js"]
